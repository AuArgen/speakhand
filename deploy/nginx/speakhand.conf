# Сүйлө (speakhand) — nginx сайт конфигурациясы.
#
# Орнотуу (Ubuntu/Debian):
#   1) sudo cp deploy/nginx/speakhand.conf /etc/nginx/sites-available/speakhand.conf
#   2) Төмөндөгү example.kg'ни өз доменине алмаштырыңыз (4 жерде).
#   3) sudo ln -s /etc/nginx/sites-available/speakhand.conf /etc/nginx/sites-enabled/
#   4) Сертификат: sudo certbot certonly --webroot -w /var/www/html -d example.kg
#      (биринчи жолу сертификат жок болсо — 443 блогун убактылуу комментке алып, nginx'ти reload кылыңыз)
#   5) sudo nginx -t && sudo systemctl reload nginx
#
# Тиркеме (docker compose) 127.0.0.1:8787'де гана угат — сырттан ага nginx аркылуу гана жетет.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream speakhand_app {
    server 127.0.0.1:8787;
    keepalive 16;
}

# HTTP → HTTPS (телефондор камера/микрофонду HTTPS'те гана берет)
server {
    listen 80;
    listen [::]:80;
    server_name example.kg;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name example.kg;

    ssl_certificate     /etc/letsencrypt/live/example.kg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.kg/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 1m;

    # Тиркеменин өзүнүн IP'си эмес, колдонуучунун чыныгы IP'си (лимиттер үчүн).
    # $remote_addr менен алмаштырабыз — колдонуучу өзү X-Forwarded-For жиберип алдай албайт.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Сүйлөшүү бөлмөлөрү — WebSocket (узак туташуу)
    location /ws {
        proxy_pass http://speakhand_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        proxy_pass http://speakhand_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
