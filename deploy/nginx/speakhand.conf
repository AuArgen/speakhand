# Сүйлө (speakhand) — nginx: https://sh.primeactive.net
#
# Домен Cloudflare проксиси аркылуу өтөт (DNS: кызгылт сары булут). Ошондуктан:
#   • Сертификат — Cloudflare Origin Certificate (15 жыл, certbot керек эмес).
#     Cloudflare → SSL/TLS → Overview: режим «Full (strict)».
#     Cloudflare → SSL/TLS → Origin Server → Create Certificate (sh.primeactive.net) →
#       сертификатты /etc/ssl/cloudflare/sh.primeactive.net.pem ге,
#       ачкычты     /etc/ssl/cloudflare/sh.primeactive.net.key ге сактаңыз (chmod 600).
#   • Колдонуучунун чыныгы IP'си CF-Connecting-IP'ден — Cloudflare'дин IP'лерине гана ишенебиз.
#
# Орнотуу (Ubuntu/Debian):
#   sudo cp deploy/nginx/speakhand.conf /etc/nginx/sites-available/speakhand.conf
#   sudo ln -s /etc/nginx/sites-available/speakhand.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Тиркеме (docker compose) 127.0.0.1:8787'де гана угат — сырттан ага nginx аркылуу гана жетет.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream speakhand_app {
    server 127.0.0.1:8787;
    keepalive 16;
}

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name sh.primeactive.net;

    # Let's Encrypt колдонсоңуз гана керек (Cloudflare Origin Certificate'ке керек эмес)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name sh.primeactive.net;

    # Cloudflare Origin Certificate (жогорудагы нускаманы караңыз).
    # Let's Encrypt колдонсоңуз: /etc/letsencrypt/live/sh.primeactive.net/fullchain.pem жана privkey.pem
    ssl_certificate     /etc/ssl/cloudflare/sh.primeactive.net.pem;
    ssl_certificate_key /etc/ssl/cloudflare/sh.primeactive.net.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # --- Колдонуучунун чыныгы IP'си (Cloudflare артында) ---
    # Тизме: https://www.cloudflare.com/ips-v4 жана /ips-v6 (сейрек өзгөрөт; 2026-10-14 абалы).
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    client_max_body_size 1m;

    # Сүйлөшүү бөлмөлөрү — WebSocket (узак туташуу; кардар ар 20 сек ping жиберет —
    # Cloudflare'дин 100 сек бош туруу чегинен аз)
    location /ws {
        proxy_pass http://speakhand_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        proxy_pass http://speakhand_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        # $remote_addr — жогорудагы real_ip'тен кийин колдонуучунун чыныгы IP'си
        # (X-Forwarded-For'ду алмаштырабыз — колдонуучу өзү жиберип алдай албайт)
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
