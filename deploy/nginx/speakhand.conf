# Сүйлө (speakhand) — nginx: sh.primeactive.net
#
# Бул жерде 80-порт гана. SSL'ди certbot өзү кошот (443 блогу, сертификат, http → https):
#   sudo cp deploy/nginx/speakhand.conf /etc/nginx/sites-available/speakhand.conf
#   sudo ln -s /etc/nginx/sites-available/speakhand.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d sh.primeactive.net
#
# Тиркеме (docker compose) 127.0.0.1:8009'да гана угат (.env: APP_PORT=8009) — сыртка жабык.

# WebSocket үчүн (атайын ат — сервердеги башка сайттардын map'тары менен кагылышпасын)
map $http_upgrade $speakhand_connection_upgrade {
    default upgrade;
    ''      close;
}

upstream speakhand_app {
    server 127.0.0.1:8009;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name sh.primeactive.net;

    client_max_body_size 1m;

    # Колдонуучунун чыныгы IP'си: домен Cloudflare аркылуу өтсө — CF-Connecting-IP'ден,
    # Cloudflare'дин расмий IP'леринен келгенде гана (башкалардын жасалма башкысы эске алынбайт).
    # Тизме: https://www.cloudflare.com/ips-v4 жана /ips-v6 (2026-10-14 абалы).
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # Сүйлөшүү бөлмөлөрү — WebSocket (узак туташуу; кардар ар 20 сек ping жиберет)
    location /ws {
        proxy_pass http://speakhand_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $speakhand_connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        proxy_pass http://speakhand_app;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        # $remote_addr — колдонуучунун чыныгы IP'си; X-Forwarded-For'ду алмаштырабыз (алдоого болбойт)
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
