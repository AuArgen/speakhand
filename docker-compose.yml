# Сүйлө — Docker Compose.
#
# Сыртка эч бир порт ачылбайт: тиркеме серверде 127.0.0.1:8787'де гана угат,
# сырттан кирүү ушул сервердеги nginx аркылуу гана (deploy/nginx/speakhand.conf).
#
#   docker compose up -d --build                    # тиркеме
#   docker compose --profile tts up -d --build      # + кыргызча үн (MMS-TTS, ички тармакта гана)
#
# Жөндөөлөр .env файлында (.env.example'ди көчүрүңүз).
name: suylo

services:
  app:
    build: .
    image: suylo-app:latest
    restart: unless-stopped
    ports:
      # 127.0.0.1 гана — сырттан түз кирүү жок (Docker'дин порттору ufw'ну айланып өтөт,
      # ошондуктан 0.0.0.0'ге ЭЧ КАЧАН ачпаңыз). nginx ушул дарекке проксилейт.
      - "127.0.0.1:${APP_PORT:-8787}:8787"
    environment:
      DATA_DIR: /data
      # Тиркемеге nginx гана кайрылат — чыныгы IP X-Forwarded-For'дон алынат.
      TRUST_PROXY: "1"
      TTS_URL: http://tts:8790
    volumes:
      - suylo-data:/data

  tts:
    profiles: ["tts"]
    build: ./tts
    image: suylo-tts:latest
    restart: unless-stopped
    # Порт серверге да ачылбайт — тиркеме гана Docker'дин ички тармагы аркылуу кайрылат.
    expose:
      - "8790"

volumes:
  suylo-data:
