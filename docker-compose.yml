# Сүйлө — Docker Compose.
#
#   docker compose up -d --build                         # тиркеме: http://<сервер>:8787
#   docker compose --profile tts up -d --build           # + кыргызча үн (MMS-TTS, ~1.5 ГБ сүрөт)
#   DOMAIN=suylo.example.kg docker compose --profile https up -d --build
#                                                        # + Caddy: автоматтык HTTPS (Let's Encrypt), 80/443 порттору
#
# Жөндөөлөр .env файлында (.env.example'ди көчүрүңүз).
name: suylo

services:
  app:
    build: .
    image: suylo-app:latest
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8787}:8787"
    environment:
      DATA_DIR: /data
      # Caddy/nginx артында болсо 1 (чыныгы IP X-Forwarded-For'дон алынат)
      TRUST_PROXY: "${TRUST_PROXY:-0}"
      # 1 — өзү кол койгон сертификат менен HTTPS (домен жок болсо, телефондун камерасы үчүн)
      HTTPS: "${HTTPS:-0}"
      TTS_URL: http://tts:8790
    volumes:
      - suylo-data:/data

  tts:
    profiles: ["tts"]
    build: ./tts
    image: suylo-tts:latest
    restart: unless-stopped
    expose:
      - "8790"

  caddy:
    profiles: ["https"]
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      # Домен (мис. suylo.example.kg же 203.0.113.5.sslip.io). Бош болсо — localhost (жергиликтүү сертификат).
      DOMAIN: "${DOMAIN:-localhost}"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  suylo-data:
  caddy-data:
  caddy-config:
