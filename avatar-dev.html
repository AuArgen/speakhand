<!doctype html>
<html lang="ky">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Avatar dev</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
      body { background: radial-gradient(120% 90% at 50% 20%, #232a4a 0%, #121528 55%, #0a0b14 100%); color: #e8ebff; overflow: hidden; }
      body.light { background: radial-gradient(120% 90% at 50% 20%, #ffffff 0%, #eef1fb 55%, #dde3f5 100%); color: #1a1f33; }
      #stage { position: fixed; inset: 0; }
      #panel { position: fixed; left: 12px; top: 12px; width: 260px; max-height: calc(100% - 24px); overflow: auto; background: rgba(20, 24, 44, 0.72); backdrop-filter: blur(8px); border-radius: 12px; padding: 10px; font-size: 13px; z-index: 2; }
      body.light #panel { background: rgba(255, 255, 255, 0.8); }
      #panel button { margin: 2px; padding: 5px 8px; border-radius: 7px; border: 1px solid rgba(127, 140, 255, 0.4); background: rgba(90, 110, 255, 0.18); color: inherit; cursor: pointer; font-size: 12px; }
      #panel input { width: 140px; padding: 4px; border-radius: 6px; border: 1px solid #667; }
      #caption { position: fixed; bottom: 28px; left: 0; right: 0; text-align: center; font-size: 28px; font-weight: 700; letter-spacing: 0.04em; z-index: 2; text-shadow: 0 2px 12px rgba(0,0,0,0.4); }
      h4 { margin: 8px 0 4px; font-size: 12px; opacity: 0.7; text-transform: uppercase; }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="panel">
      <h4>Demo signs</h4>
      <div id="signs"></div>
      <button id="all">▶ all</button>
      <button id="stop">■ stop</button>
      <h4>Speed</h4>
      <input id="speed" type="range" min="0.02" max="1.5" step="0.01" value="1" style="width: 200px" /> <span id="speedv">1</span>
      <h4>Fingerspell</h4>
      <input id="fs" value="салам" /> <button id="fsgo">spell</button>
      <h4>Mocap tests</h4>
      <button id="live">live: LEFT hand wave</button>
      <button id="liveR">live: RIGHT hand fist/open</button>
      <button id="clip">mocap clip</button>
      <button id="release">release live</button>
      <h4>Shapes</h4>
      <div id="shapes"></div>
      <h4>Theme</h4>
      <button id="theme">toggle theme</button>
    </div>
    <div id="caption"></div>
    <script type="module" src="/src/avatar/dev.ts"></script>
  </body>
</html>
