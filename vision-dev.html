<!doctype html>
<html lang="ky">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>Vision dev — камера → жест</title>
    <style>
      :root { color-scheme: dark; --bg: #0b0f14; --panel: #121821; --line: #223042; --fg: #e6edf3; --mute: #8b9bb0; --ok: #4fe3c1; --bad: #ff6b81; }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 system-ui, sans-serif; }
      header { display: flex; gap: 12px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
      header h1 { font-size: 15px; margin: 0 12px 0 0; font-weight: 600; }
      button, label.chk { background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; font: inherit; cursor: pointer; }
      #status { color: var(--mute); }
      main { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 16px; padding: 16px; }
      @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
      .stage { position: relative; background: #000; border-radius: 12px; overflow: hidden; aspect-ratio: 4 / 3; }
      .stage video, .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
      .stage video { transform: scaleX(-1); }
      .badge { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,.55); padding: 4px 10px; border-radius: 999px; font: 12px ui-monospace, monospace; }
      .badge.seg { left: auto; right: 10px; }
      .badge.seg.on { background: rgba(79,227,193,.85); color: #002; }
      aside { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
      .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
      .card h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--mute); margin: 0 0 8px; }
      pre { margin: 0; font: 12px/1.5 ui-monospace, SFMono-Regular, Consolas, monospace; white-space: pre-wrap; word-break: break-word; }
      .ok { color: var(--ok); } .bad { color: var(--bad); } .mute { color: var(--mute); }
    </style>
  </head>
  <body>
    <header>
      <h1>vision-dev</h1>
      <button id="cam">Камера</button>
      <label class="chk"><input type="checkbox" id="face" /> бет</label>
      <label class="chk"><input type="checkbox" id="full" /> pose full</label>
      <span id="status">…</span>
    </header>
    <main>
      <div class="stage">
        <video id="video" playsinline muted></video>
        <canvas id="overlay"></canvas>
        <div class="badge" id="fps">— fps</div>
        <div class="badge seg" id="seg">rest</div>
      </div>
      <aside>
        <div class="card"><h2>Координаттарды текшерүү</h2><pre id="checks" class="mute">pose күтүлүүдө…</pre></div>
        <div class="card"><h2>Учурдагы кадр</h2><pre id="dump"></pre></div>
        <div class="card"><h2>Акыркы сегменттер</h2><pre id="segs" class="mute">—</pre></div>
      </aside>
    </main>
    <script type="module" src="/src/vision/dev.ts"></script>
  </body>
</html>
